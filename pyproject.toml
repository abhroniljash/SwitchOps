[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "switchops"
version = "1.0.0"
description = "Autonomous Incident Commander & Self-Healing SRE Teammate for Slack & Discord via Switch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "SwitchOps Team" }
]
dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0"
]

[project.scripts]
switchops = "switchops.cli:main"
